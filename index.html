<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ORBITO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #10122b;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%; height: 100%;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  /* ============================================================
     ORBITO — orbit lane-switch endless arcade
     Tap to flip between the inner and outer lane of the ring.
     Dodge the red arcs, catch the gold gems, chain the combo.
     ============================================================ */

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var cx = 0, cy = 0;          // ring center
  var R = 0;                    // ring base radius
  var laneOff = 0;              // distance from ring to each lane
  var ballR = 0;                // ball radius
  var uiScale = 1;

  var TAU = Math.PI * 2;

  /* ---------- persistence (guarded: still runs where storage is blocked) ---------- */
  function loadNum(key, fb) {
    try { var v = localStorage.getItem(key); return v === null ? fb : (parseInt(v, 10) || 0); }
    catch (e) { return fb; }
  }
  function save(key, val) {
    try { localStorage.setItem(key, String(val)); } catch (e) {}
  }

  var best      = loadNum('orbito_best', 0);
  var bestCombo = loadNum('orbito_maxcombo', 0);
  var skinIdx   = loadNum('orbito_skin', 0);

  /* ---------- skins (unlocked by best score) ---------- */
  var SKINS = [
    { name: 'Coral',  col: '#FF6B6B', trail: '#FF9E80', glow: 'rgba(255,107,107,0.55)', need: 0   },
    { name: 'Mint',   col: '#4FE3B0', trail: '#A7F3D0', glow: 'rgba(79,227,176,0.55)',  need: 15  },
    { name: 'Gold',   col: '#FFC94A', trail: '#FFE29A', glow: 'rgba(255,201,74,0.55)',  need: 40  },
    { name: 'Violet', col: '#B18CFF', trail: '#D9C8FF', glow: 'rgba(177,140,255,0.55)', need: 80  },
    { name: 'Nova',   col: '#55D6F5', trail: '#B9F0FF', glow: 'rgba(85,214,245,0.55)',  need: 150 }
  ];
  if (skinIdx < 0 || skinIdx >= SKINS.length || SKINS[skinIdx].need > best) skinIdx = 0;
  function skin() { return SKINS[skinIdx]; }

  /* ---------- game state ---------- */
  var STATE = { READY: 0, PLAY: 1, OVER: 2 };
  var state = STATE.READY;

  var ball = { ang: -Math.PI / 2, lane: 0, r: 0, squash: 0 };
  var items = [];        // { ang, lane, type:'obs'|'gem', span, dead, passed, pulse }
  var particles = [];
  var popups = [];
  var trail = [];
  var stars = [];

  var score = 0, combo = 0, maxComboRun = 0, mult = 1;
  var angSpeed = 0;
  var spawnAcc = 0, spawnGap = 2.4;
  var shake = 0;
  var scorePop = 0, comboPop = 0, ringPulse = 0, flashT = 0;
  var overT = 0, readyT = 0, playT = 0;
  var newBest = false, newUnlock = -1;
  var hueBase = 232;
  var swatchHits = [];   // clickable skin swatch rects

  /* ---------- audio: tiny Web Audio synth, no assets ---------- */
  var AC = null, master = null;
  function audio() {
    if (!AC) {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      AC = new Ctor();
      master = AC.createGain();
      master.gain.value = 0.5;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone(freq, endFreq, dur, type, vol, when) {
    var ac = audio(); if (!ac) return;
    var t0 = ac.currentTime + (when || 0);
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq || freq), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, when) {
    var ac = audio(); if (!ac) return;
    var t0 = ac.currentTime + (when || 0);
    var n = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ac.createBufferSource(); src.buffer = buf;
    var g = ac.createGain(); g.gain.value = vol;
    var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0);
  }
  var PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  function sfxFlip()    { tone(300, 420, 0.07, 'square', 0.12); }
  function sfxCollect() {
    var st = PENTA[Math.min(combo, 24) % PENTA.length] + Math.floor(Math.min(combo, 24) / PENTA.length) * 12;
    var f = 523 * Math.pow(2, st / 12);
    tone(f, f * 1.01, 0.12, 'sine', 0.22);
    tone(f * 2, f * 2, 0.09, 'sine', 0.07, 0.02);
  }
  function sfxScore()   { tone(660, 660, 0.05, 'triangle', 0.05); }
  function sfxMilestone(){ tone(784, 784, 0.1, 'triangle', 0.16); tone(1175, 1175, 0.14, 'triangle', 0.16, 0.09); }
  function sfxHit()     { noise(0.28, 0.5); tone(180, 40, 0.32, 'sawtooth', 0.3); }
  function sfxOver()    { tone(392, 392, 0.16, 'triangle', 0.18, 0.15); tone(311, 311, 0.16, 'triangle', 0.18, 0.32); tone(233, 233, 0.3, 'triangle', 0.18, 0.49); }
  function sfxBest()    { tone(523,523,0.1,'triangle',0.18,0.5); tone(659,659,0.1,'triangle',0.18,0.62); tone(784,784,0.1,'triangle',0.18,0.74); tone(1047,1047,0.24,'triangle',0.2,0.86); }
  function sfxUnlock()  { tone(880,1760,0.22,'sine',0.16,0.9); }

  /* ---------- helpers ---------- */
  function wrapPI(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function laneRadius(lane) { return lane === 0 ? R - laneOff : R + laneOff; }
  function rounded(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- responsive layout ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var portrait = H >= W;
    cx = W / 2;
    cy = portrait ? H * 0.54 : H * 0.5;
    R = Math.min(W, H) * (portrait ? 0.34 : 0.32);
    laneOff = R * 0.3;
    ballR = Math.max(9, R * 0.085);
    uiScale = clamp(Math.min(W, H) / 420, 0.72, 1.5);

    stars = [];
    var n = Math.floor((W * H) / 16000);
    for (var i = 0; i < n; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(0.6, 2.2), v: rand(3, 12), tw: Math.random() * TAU });
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  /* ---------- particles & popups ---------- */
  function burst(x, y, col, n, spd, size, grav) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var v = rand(spd * 0.3, spd);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1, decay: rand(1.4, 2.6),
        size: rand(size * 0.4, size), col: col, grav: grav || 0
      });
    }
  }
  function popup(x, y, txt, col, big) {
    popups.push({ x: x, y: y, txt: txt, col: col, life: 1, big: !!big });
  }

  /* ---------- spawning ---------- */
  function spawnPattern() {
    var lead = 1.9; // all spawn offsets (lead + pattern extras) must stay below PI so wrapPI() sees them as "ahead"
    var a = ball.ang + lead;
    var lane = Math.random() < 0.5 ? 0 : 1;
    var diff = clamp(score / 90, 0, 1);
    var span = lerp(0.42, 0.6, diff) * (Math.random() < 0.25 ? 1.5 : 1);

    items.push({ ang: a, lane: lane, type: 'obs', span: span, dead: false, passed: false, pulse: Math.random() * TAU });

    if (score > 18 && Math.random() < lerp(0.12, 0.4, diff)) {
      items.push({ ang: a + rand(0.85, 1.15), lane: 1 - lane, type: 'obs', span: span * 0.85, dead: false, passed: false, pulse: Math.random() * TAU });
    }
    if (Math.random() < 0.62) {
      var gLane = Math.random() < 0.65 ? 1 - lane : lane;
      var gAng = gLane === lane ? a + rand(0.55, 0.8) : a + rand(-0.1, 0.35);
      items.push({ ang: gAng, lane: gLane, type: 'gem', span: 0, dead: false, passed: false, pulse: Math.random() * TAU });
    }
  }

  /* ---------- state control ---------- */
  function resetRun() {
    items.length = 0;
    particles.length = 0;
    popups.length = 0;
    trail.length = 0;
    score = 0; combo = 0; maxComboRun = 0; mult = 1;
    spawnAcc = -1.4;             // grace distance before the first wall
    spawnGap = 2.4;
    ball.ang = -Math.PI / 2;
    ball.lane = 0;
    ball.r = laneRadius(0);
    ball.squash = 0;
    shake = 0; scorePop = 0; comboPop = 0; ringPulse = 0; flashT = 0;
    newBest = false; newUnlock = -1;
    playT = 0;
  }

  function startGame() {
    resetRun();
    state = STATE.PLAY;
    ringPulse = 1;
    sfxFlip();
  }

  function gameOver() {
    state = STATE.OVER;
    overT = 0;
    shake = 16;
    flashT = 1;
    var bx = cx + Math.cos(ball.ang) * ball.r;
    var by = cy + Math.sin(ball.ang) * ball.r;
    burst(bx, by, skin().col, 34, 340, 7, 260);
    burst(bx, by, '#FFFFFF', 14, 220, 4, 200);
    sfxHit(); sfxOver();

    if (bestCombo < maxComboRun) { bestCombo = maxComboRun; save('orbito_maxcombo', bestCombo); }
    if (score > best) {
      var prev = best;
      best = score;
      save('orbito_best', best);
      newBest = true;
      sfxBest();
      for (var i = 0; i < SKINS.length; i++) {
        if (SKINS[i].need > prev && SKINS[i].need <= best) { newUnlock = i; sfxUnlock(); }
      }
    }
  }

  /* ---------- input ---------- */
  function hitSwatch(px, py) {
    for (var i = 0; i < swatchHits.length; i++) {
      var s = swatchHits[i];
      if (px >= s.x && px <= s.x + s.w && py >= s.y && py <= s.y + s.h) return s.idx;
    }
    return -1;
  }
  function press(px, py) {
    audio();
    if (state === STATE.READY) {
      var idx = hitSwatch(px, py);
      if (idx >= 0) {
        if (SKINS[idx].need <= best) { skinIdx = idx; save('orbito_skin', skinIdx); sfxScore(); }
        else { tone(160, 140, 0.08, 'square', 0.1); }
        return;
      }
      startGame();
    } else if (state === STATE.PLAY) {
      ball.lane = 1 - ball.lane;
      ball.squash = 1;
      sfxFlip();
      var bx = cx + Math.cos(ball.ang) * ball.r;
      var by = cy + Math.sin(ball.ang) * ball.r;
      burst(bx, by, skin().trail, 6, 120, 3.2, 0);
    } else if (state === STATE.OVER) {
      var idx2 = hitSwatch(px, py);
      if (idx2 >= 0) {
        if (SKINS[idx2].need <= best) { skinIdx = idx2; save('orbito_skin', skinIdx); sfxScore(); }
        else { tone(160, 140, 0.08, 'square', 0.1); }
        return;
      }
      if (overT > 0.55) startGame();
    }
  }
  function pointerHandler(e) {
    e.preventDefault();
    var t = e.changedTouches ? e.changedTouches[0] : e;
    press(t.clientX, t.clientY);
  }
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', pointerHandler, { passive: false });
  } else {
    canvas.addEventListener('touchstart', pointerHandler, { passive: false });
    canvas.addEventListener('mousedown', pointerHandler, { passive: false });
  }
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault();
      press(-999, -999);
    }
  });

  /* ---------- update ---------- */
  function update(dt) {
    hueBase += dt * 1.6;
    if (shake > 0) shake = Math.max(0, shake - dt * 34);
    if (scorePop > 0) scorePop = Math.max(0, scorePop - dt * 3.4);
    if (comboPop > 0) comboPop = Math.max(0, comboPop - dt * 3.2);
    if (ringPulse > 0) ringPulse = Math.max(0, ringPulse - dt * 2.2);
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 3);
    if (ball.squash > 0) ball.squash = Math.max(0, ball.squash - dt * 6);
    readyT += dt;
    if (state === STATE.OVER) overT += dt;

    for (var i = stars.length - 1; i >= 0; i--) {
      var s = stars[i];
      s.y += s.v * dt; s.tw += dt * 2;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= pt.decay * dt;
      if (pt.life <= 0) { particles.splice(p, 1); continue; }
      pt.vy += pt.grav * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= (1 - 1.6 * dt); pt.vy *= (1 - 1.6 * dt);
    }
    for (var u = popups.length - 1; u >= 0; u--) {
      var pu = popups[u];
      pu.life -= dt * 1.1;
      pu.y -= 46 * dt * uiScale;
      if (pu.life <= 0) popups.splice(u, 1);
    }

    if (state !== STATE.PLAY) {
      if (state === STATE.READY) {
        ball.ang += dt * 0.9;
        ball.r = lerp(ball.r || laneRadius(0), laneRadius(ball.lane), 1 - Math.pow(0.0001, dt));
        pushTrail();
      }
      return;
    }

    playT += dt;
    angSpeed = 1.45 + Math.min(1.65, score * 0.02);
    ball.ang += angSpeed * dt;
    var target = laneRadius(ball.lane);
    ball.r = lerp(ball.r, target, 1 - Math.pow(0.000001, dt));
    pushTrail();

    spawnAcc += angSpeed * dt;
    if (spawnAcc >= spawnGap) {
      spawnAcc -= spawnGap;
      spawnGap = rand(1.9, 2.6) - Math.min(0.7, score * 0.006);
      spawnPattern();
    }

    var bx = cx + Math.cos(ball.ang) * ball.r;
    var by = cy + Math.sin(ball.ang) * ball.r;

    for (var k = items.length - 1; k >= 0; k--) {
      var it = items[k];
      it.pulse += dt * 4;
      var d = wrapPI(it.ang - ball.ang);
      var lr = laneRadius(it.lane);

      if (!it.dead) {
        if (it.type === 'gem') {
          var gemAng = (ballR + ballR * 0.9) / lr;
          if (Math.abs(d) < gemAng && Math.abs(ball.r - lr) < ballR * 1.8) {
            it.dead = true;
            combo++;
            if (combo > maxComboRun) maxComboRun = combo;
            mult = 1 + Math.floor(combo / 4);
            comboPop = 1;
            var gx = cx + Math.cos(it.ang) * lr;
            var gy = cy + Math.sin(it.ang) * lr;
            burst(gx, gy, '#FFD75E', 14, 200, 4.5, 60);
            burst(gx, gy, '#FFFFFF', 6, 140, 2.6, 40);
            popup(gx, gy, mult > 1 ? '\u00d7' + mult : '+', '#FFD75E', mult > 1 && combo % 4 === 0);
            shake = Math.max(shake, 2.5);
            sfxCollect();
            continue;
          }
        } else {
          var half = it.span / 2 + ballR / lr;
          if (Math.abs(d) < half && Math.abs(ball.r - lr) < ballR * 1.55) {
            gameOver();
            return;
          }
        }
      }

      if (!it.passed && d < -0.32) {
        it.passed = true;
        if (it.type === 'obs' && !it.dead) {
          score += mult;
          scorePop = 1;
          sfxScore();
          if (score % 25 < mult && score >= 25) {
            ringPulse = 1;
            sfxMilestone();
            popup(cx, cy - R - 30 * uiScale, String(Math.floor(score / 25) * 25), '#FFFFFF', true);
          }
        } else if (it.type === 'gem' && !it.dead) {
          if (combo > 0) {
            popup(bx, by, 'combo lost', 'rgba(255,255,255,0.7)', false);
            tone(220, 180, 0.1, 'triangle', 0.08);
          }
          combo = 0; mult = 1;
        }
      }
      if (d < -1.2) items.splice(k, 1);
    }
  }

  function pushTrail() {
    trail.push({ x: cx + Math.cos(ball.ang) * ball.r, y: cy + Math.sin(ball.ang) * ball.r });
    if (trail.length > 22) trail.shift();
  }

  /* ---------- drawing ---------- */
  function drawBackground() {
    var h1 = hueBase % 360;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'hsl(' + h1 + ', 46%, 13%)');
    g.addColorStop(0.55, 'hsl(' + ((h1 + 24) % 360) + ', 44%, 17%)');
    g.addColorStop(1, 'hsl(' + ((h1 + 48) % 360) + ', 42%, 12%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(s.tw);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    var v = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.3, cx, cy, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,10,0.45)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function drawRing() {
    var pr = 1 + ringPulse * 0.045;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pr, pr);
    ctx.translate(-cx, -cy);

    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.setLineDash([2, 9]);
    ctx.beginPath(); ctx.arc(cx, cy, laneRadius(0), 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, laneRadius(1), 0, TAU); ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255,255,255,' + (0.32 + ringPulse * 0.4) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.dead) continue;
      var lr = laneRadius(it.lane);
      if (it.type === 'obs') {
        var pw = ballR * (1.7 + Math.sin(it.pulse) * 0.12);
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#FF4D5E';
        ctx.shadowColor = 'rgba(255,77,94,0.6)';
        ctx.shadowBlur = 14;
        ctx.lineWidth = pw;
        ctx.beginPath();
        ctx.arc(cx, cy, lr, it.ang - it.span / 2, it.ang + it.span / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = pw * 0.28;
        ctx.beginPath();
        ctx.arc(cx, cy, lr + pw * 0.22, it.ang - it.span / 2 + 0.03, it.ang + it.span / 2 - 0.03);
        ctx.stroke();
        ctx.restore();
      } else {
        var gx = cx + Math.cos(it.ang) * lr;
        var gy = cy + Math.sin(it.ang) * lr;
        var gs = ballR * (0.72 + Math.sin(it.pulse) * 0.1);
        ctx.save();
        ctx.translate(gx, gy);
        ctx.rotate(it.ang + it.pulse * 0.3);
        ctx.shadowColor = 'rgba(255,215,94,0.8)';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#FFD75E';
        ctx.beginPath();
        ctx.moveTo(0, -gs); ctx.lineTo(gs * 0.78, 0); ctx.lineTo(0, gs); ctx.lineTo(-gs * 0.78, 0);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(0, -gs * 0.45); ctx.lineTo(gs * 0.3, 0); ctx.lineTo(0, gs * 0.1); ctx.lineTo(-gs * 0.3, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawBall() {
    var sk = skin();
    for (var i = 0; i < trail.length; i++) {
      var t = i / trail.length;
      ctx.globalAlpha = t * 0.32;
      ctx.fillStyle = sk.trail;
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, ballR * t * 0.85, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var bx = cx + Math.cos(ball.ang) * ball.r;
    var by = cy + Math.sin(ball.ang) * ball.r;
    var sq = ball.squash;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(ball.ang);
    ctx.scale(1 - sq * 0.22, 1 + sq * 0.28);
    ctx.shadowColor = sk.glow;
    ctx.shadowBlur = 18;
    ctx.fillStyle = sk.col;
    ctx.beginPath(); ctx.arc(0, 0, ballR, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(-ballR * 0.3, -ballR * 0.32, ballR * 0.34, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.fillStyle = p.col;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < popups.length; i++) {
      var p = popups[i];
      var sc = p.big ? 1.4 : 1;
      var pop = 1 + Math.max(0, p.life - 0.75) * 2.4;
      ctx.globalAlpha = clamp(p.life * 1.4, 0, 1);
      ctx.fillStyle = p.col;
      ctx.font = '800 ' + Math.round(20 * uiScale * sc * pop) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText(p.txt, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function drawSwatches(y) {
    swatchHits.length = 0;
    var size = 40 * uiScale;
    var gap = 12 * uiScale;
    var total = SKINS.length * size + (SKINS.length - 1) * gap;
    var x0 = cx - total / 2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < SKINS.length; i++) {
      var sx = x0 + i * (size + gap);
      var unlocked = SKINS[i].need <= best;
      swatchHits.push({ x: sx - 6, y: y - 6, w: size + 12, h: size + 12, idx: i });

      rounded(sx, y, size, size, size * 0.3);
      ctx.fillStyle = unlocked ? SKINS[i].col : 'rgba(255,255,255,0.1)';
      ctx.fill();
      if (i === skinIdx) {
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();
      }
      if (!unlocked) {
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '700 ' + Math.round(12 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText(String(SKINS[i].need), sx + size / 2, y + size / 2 + 1);
        ctx.font = '700 ' + Math.round(9 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.fillText('best', sx + size / 2, y - 8 * uiScale);
      } else if (newUnlock === i) {
        ctx.fillStyle = '#FFD75E';
        ctx.font = '800 ' + Math.round(10 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText('new', sx + size / 2, y - 8 * uiScale);
      }
    }
  }

  function drawHUD() {
    ctx.textAlign = 'center';
    var topY = Math.max(H * 0.06, 34 * uiScale);

    if (state === STATE.PLAY || state === STATE.READY) {
      ctx.textBaseline = 'alphabetic';
      var pop = 1 + scorePop * 0.35;
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 8;
      ctx.font = '800 ' + Math.round(52 * uiScale * pop) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText(String(score), cx, topY + 40 * uiScale);
      ctx.shadowBlur = 0;

      if (combo >= 2) {
        var cpop = 1 + comboPop * 0.4;
        ctx.fillStyle = '#FFD75E';
        ctx.font = '800 ' + Math.round(19 * uiScale * cpop) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
        ctx.fillText('combo ' + combo + '  \u00d7' + mult, cx, topY + 66 * uiScale);
      }

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.font = '700 ' + Math.round(13 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('best ' + best, W - 16, 24 * uiScale);
      ctx.textAlign = 'center';
    }

    if (state === STATE.READY) {
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = skin().glow;
      ctx.shadowBlur = 24;
      ctx.font = '800 ' + Math.round(44 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('O R B I T O', cx, cy - 14 * uiScale);
      ctx.shadowBlur = 0;

      var pulse = 0.65 + 0.35 * Math.sin(readyT * 4.4);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 ' + Math.round(19 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('tap to play', cx, cy + 26 * uiScale);
      ctx.globalAlpha = 1;

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 ' + Math.round(13 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('tap to switch lanes \u00b7 dodge red \u00b7 catch gems', cx, cy + 52 * uiScale);

      drawSwatches(Math.min(H - 70 * uiScale, cy + R + 34 * uiScale));
    }

    if (state === STATE.OVER) {
      var a = clamp(overT * 2.2, 0, 1);
      ctx.fillStyle = 'rgba(8,8,24,' + (a * 0.62) + ')';
      ctx.fillRect(0, 0, W, H);

      var pw = Math.min(W * 0.86, 360 * uiScale);
      var ph = 250 * uiScale;
      var px = cx - pw / 2;
      var py = cy - ph / 2 - 26 * uiScale;
      var slide = (1 - a) * 30 * uiScale;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(0, slide);

      rounded(px, py, pw, ph, 22 * uiScale);
      ctx.fillStyle = 'rgba(20,22,52,0.92)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '700 ' + Math.round(15 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText(newBest ? 'new best!' : 'score', cx, py + 34 * uiScale);
      if (newBest) {
        ctx.fillStyle = '#FFD75E';
        ctx.fillText('new best!', cx, py + 34 * uiScale);
      }

      var bpop = 1 + Math.max(0, 1 - overT * 1.6) * 0.35;
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 ' + Math.round(58 * uiScale * bpop) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText(String(score), cx, py + 78 * uiScale);

      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.font = '600 ' + Math.round(15 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('best ' + best + '    \u00b7    combo \u00d7' + maxComboRun + ' (top \u00d7' + bestCombo + ')', cx, py + 116 * uiScale);

      var btnW = 170 * uiScale, btnH = 48 * uiScale;
      var btnY = py + ph - btnH - 22 * uiScale;
      var bp = 1 + 0.03 * Math.sin(readyT * 5);
      ctx.save();
      ctx.translate(cx, btnY + btnH / 2);
      ctx.scale(bp, bp);
      rounded(-btnW / 2, -btnH / 2, btnW, btnH, btnH / 2);
      ctx.fillStyle = skin().col;
      ctx.shadowColor = skin().glow;
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#151530';
      ctx.font = '800 ' + Math.round(19 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('play again', 0, 1);
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '600 ' + Math.round(12 * uiScale) + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
      ctx.fillText('tap anywhere', cx, btnY + btnH + 16 * uiScale);

      ctx.restore();

      ctx.globalAlpha = a;
      drawSwatches(Math.min(H - 66 * uiScale, py + ph + 26 * uiScale));
      ctx.globalAlpha = 1;
    }

    if (flashT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (flashT * 0.35) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawRing();
    drawItems();
    if (state !== STATE.OVER) drawBall();
    drawParticles();
    drawPopups();
    ctx.restore();

    drawHUD();
  }

  /* ---------- main loop ---------- */
  var lastT = 0;
  function frame(t) {
    var dt = Math.min(0.033, (t - lastT) / 1000 || 0.016);
    lastT = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  ball.r = laneRadius(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
